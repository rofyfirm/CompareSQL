# Server uji untuk round-trip test. Kredensial khusus test.
#   docker compose up -d
#   SELISIH_TEST_DB=mysql://root:selisih_test@127.0.0.1:33080 cargo test -p selisih-core
services:
  mysql80:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: selisih_test
    ports: ["33080:3306"]
  mysql84:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: selisih_test
    ports: ["33084:3306"]
  mariadb1011:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: selisih_test
    ports: ["33101:3306"]
  mariadb11:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: selisih_test
    ports: ["33114:3306"]
